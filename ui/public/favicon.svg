      <stop stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="line" x1="10" y1="44" x2="54" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b9cff"/>
