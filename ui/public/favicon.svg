    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- candles -->
  <g stroke-linecap="round">
