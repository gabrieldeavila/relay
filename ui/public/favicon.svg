    <rect x="14.5" y="35" width="7" height="10" rx="1.5" fill="#3a4150"/>
    <line x1="32" y1="22" x2="32" y2="46" stroke="#3a4150" stroke-width="2"/>
    <rect x="28.5" y="27" width="7" height="13" rx="1.5" fill="#3a4150"/>
    <line x1="46" y1="14" x2="46" y2="40" stroke="#3fbf7f" stroke-width="2"/>
    <rect x="42.5" y="18" width="7" height="16" rx="1.5" fill="#3fbf7f"/>
  </g>

  <!-- signal line -->
  <path d="M10 44 L22 38 L30 40 L54 16" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="54" cy="16" r="4.5" fill="#5b9cff"/>
